<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="flashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Shuttlecock icon -->
  <g filter="url(#shadow)">
    <!-- Cork base (rounded bottom) -->
    <path d="M26 44.5 C26 48.5, 38 48.5, 38 44.5 L38 42 L26 42 Z" fill="#ffffff"/>
    <path d="M26 42.5 L38 42.5" stroke="#059669" stroke-width="1.5"/>

    <!-- Main feather cone frame -->
    <path d="M26 42 L15 17 C23.5 15, 40.5 15, 49 17 L38 42 Z" fill="url(#featherGrad)" fill-opacity="0.95"/>
    
    <!-- Feather spine lines -->
    <line x1="32" y1="16" x2="32" y2="42" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="23.5" y1="16.5" x2="28" y2="42" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="40.5" y1="16.5" x2="36" y2="42" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="17.5" y1="17" x2="26.5" y2="42" stroke="#059669" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="46.5" y1="17" x2="37.5" y2="42" stroke="#059669" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Intersecting thread bands -->
    <path d="M19 25.5 Q32 24 45 25.5" stroke="#047857" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M22 33.5 Q32 32.5 42 33.5" stroke="#047857" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Dynamic Smash Flash (bolt / speed star) at upper right -->
    <path d="M47 9 L49 14 L54 15 L50 18 L51 23 L47 19.5 L43 22 L45 17 L41 14 L46 13.5 Z" fill="url(#flashGrad)" stroke="#ca8a04" stroke-width="0.8"/>
  </g>
</svg>
