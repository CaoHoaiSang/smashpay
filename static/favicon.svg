<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Emerald Tech Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="45%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="glassTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Feather Pearlescent Gradient -->
    <linearGradient id="featherGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>

    <!-- Gold Accent Metallic -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Speed Arc Cyan to Mint -->
    <linearGradient id="speedArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>

    <!-- Cork Specular Gradient -->
    <radialGradient id="corkShine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>

    <!-- Drop Shadow for Shuttlecock Elevation -->
    <filter id="elevate" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#022c22" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Modern Squircle Background with Micro-Border -->
  <rect width="128" height="128" rx="34" fill="url(#bgGrad)"/>
  <rect width="128" height="64" rx="34" fill="url(#glassTop)"/>
  <rect x="1" y="1" width="126" height="126" rx="33" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Dynamic Speed Arc / Smash Energy -->
  <path d="M18 86 C28 106, 76 112, 104 84 C110 78, 112 66, 108 56" stroke="url(#speedArc)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M26 94 C34 104, 62 108, 86 92" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Badminton Shuttlecock Group -->
  <g filter="url(#elevate)">
    <!-- Feather Silhouette Base (Tilted slightly 10deg) -->
    <path d="M48 74 L32 28 C45 20, 83 20, 96 28 L80 74 Z" fill="url(#featherGrad)"/>

    <!-- Distinct Feather Blades with Shading -->
    <!-- Blade 1 (Leftmost) -->
    <path d="M34 29 L48 74 L52 74 L42 27 Z" fill="#e2e8f0" fill-opacity="0.7"/>
    <!-- Blade 2 (Center Left) -->
    <path d="M48 23 L58 74 L62 74 L56 22 Z" fill="#ffffff"/>
    <!-- Blade 3 (Center Right) -->
    <path d="M68 22 L62 74 L66 74 L76 23 Z" fill="#e2e8f0" fill-opacity="0.75"/>
    <!-- Blade 4 (Rightmost) -->
    <path d="M82 27 L76 74 L80 74 L94 29 Z" fill="#cbd5e1" fill-opacity="0.8"/>

    <!-- Aerodynamic Dual Binding Ribbons (Gold & Emerald) -->
    <path d="M38 44 Q64 38 90 44" stroke="url(#goldGrad)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M43 58 Q64 53 85 58" stroke="#047857" stroke-width="2.6" stroke-linecap="round" fill="none"/>

    <!-- Gold Collar Ring at Cork Joint -->
    <path d="M49 74 L79 74 L77 78 L51 78 Z" fill="url(#goldGrad)"/>

    <!-- 3D Aerodynamic Cork Base -->
    <path d="M51 78 C51 93, 77 93, 77 78 Z" fill="url(#corkShine)"/>
    <path d="M55 83 C57 89, 71 89, 73 83" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Sparkle Victory Star (Top Right) -->
  <circle cx="102" cy="24" r="3" fill="#fde047"/>
  <path d="M102 16 L102 32 M94 24 L110 24" stroke="#fde047" stroke-width="1.8" stroke-linecap="round"/>
</svg>
